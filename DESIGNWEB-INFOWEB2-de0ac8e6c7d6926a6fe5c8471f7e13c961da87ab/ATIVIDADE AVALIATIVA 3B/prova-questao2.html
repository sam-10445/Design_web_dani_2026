<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROVA 3B</title>
</head>
<body>
    <input type="text" id="nome">
    <button id="botao">ENVIAR</button>

    <p id="resultados"></p>
    <script>
        const nomes = [];
        const botao = document.getElementById('botao');
        botao.addEventListener("click", function (e) {
            const nome = document.getElementById('nome').value;
            nomes.push(nome);
            document.getElementById('resultados').innerHTML = nomes.sort();
            document.getElementById('resultados').innerHTML = nomes.join("-");
           
        });
    </script>
</body>
</html>
