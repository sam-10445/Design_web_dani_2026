<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRING e DATA</title>
</head>
<body>
    <h1>STRING e DATAS</h1>
    <script>
        for(let num = 0; num <= 10; num++){
            console.log(num)
        }
    </script>

    <h2>STRING</h2>
    <script>
        let nome = 'INFOWEB';
        console.log('Comprimento da String '+ nome.length); //na variável
        console.log('Comprimento da String '+ 'SAMARA'.length); //direto no string
        console.log(`Comprimento da String ${'SAMARA'.length}`); //pode usar ` ao invés de aspas

        console.log(`Posição do caracter na String: ${nome.charAt(0)}`);
        //recebe a posição ex: 0 -> primeiro item (I)

        console.log(`Substitui na String: ${nome.replace('INFO', 'Informática para ')}`)
        //substtuiu o "INFO" por "Informática para"

        console.log(`Fatia a String: ${nome.slice(1, 4)}`)
        //recebe a posição inicial e a posição final (números inteiros)

        console.log(`Coloca em maiúsculas: ${'ifrn'.toUpperCase()}`)
        console.log(`Coloca tudo em minúsculas: ${nome.toLowerCase()}`)
    </script>

    <!-- EXERCÍCIO PRÁTICO -->
